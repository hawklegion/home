  <!-- Shield inner border -->
  <path d="M256 60 L412 130 L412 270 Q412 380 256 450 Q100 380 100 270 L100 130 Z"
        fill="none" stroke="#AA7A1E" stroke-width="3" opacity="0.6"/>
  <!-- Wings -->
  <path d="M72 160 Q20 140 8 200 Q0 240 40 260 Q60 268 72 260"
