  <!-- Sword -->
  <rect x="248" y="160" width="16" height="180" rx="3" fill="#F4E0A5" stroke="#8C6D23" stroke-width="3"/>
  <!-- Sword crossguard -->
  <rect x="228" y="170" width="56" height="10" rx="2" fill="url(#sg)"/>
  <!-- Sword pommel -->
  <circle cx="256" cy="345" r="8" fill="url(#sg)" stroke="#8C6D23" stroke-width="2"/>
  <!-- Sword tip -->
  <polygon points="256,150 244,170 268,170" fill="#F4E0A5" stroke="#8C6D23" stroke-width="2"/>
  <!-- Center gem/rune -->
  <circle cx="256" cy="240" r="18" fill="#FDFBF7" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="256" cy="240" r="10" fill="url(#g)"/>
  <!-- Runes -->
  <text x="256" y="316" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#D4AF37">ᚻ</text>
  <text x="310" y="200" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#D4AF37" opacity="0.7">ᛚ</text>
  <text x="200" y="200" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#D4AF37" opacity="0.7">ᚨ</text>
</svg>
